name: "Commons Library CI"

on:
  push:
    branches:
      - master
      - main
      - feature/phase4
  pull_request:
    branches:
      - master
      - main
      - feature/phase4
  workflow_dispatch:

concurrency:
  group: ci-commons-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build-and-verify:
    name: "Build, Test & Verify Modules (Java 25)"
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up OpenJDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven
          server-id: github
          settings-path: ${{ github.workspace }}

      - name: Compile and Run Module Tests
        run: mvn clean test jacoco:report -B

      - name: SonarQube / SonarCloud Analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL || secrets.SONAR_HOST_URL || 'https://sonarcloud.io' }}
        if: ${{ env.SONAR_TOKEN != '' }}
        run: |
          mvn -B verify sonar:sonar \
            -Dsonar.host.url=$SONAR_HOST_URL \
            -Dsonar.token=$SONAR_TOKEN \
            -Dsonar.organization=rodsordi \
            -Dsonar.projectKey=rodsordi_15soat-phase4-lib-commons \
            -Dsonar.qualitygate.wait=false
        continue-on-error: true

      - name: Build & Install Modules to Local Maven Cache
        run: mvn install -DskipTests -B

      - name: Publish Modules to GitHub Packages
        if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feature/phase4')
        run: mvn deploy -DskipTests -B -s ${{ github.workspace }}/settings.xml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
