name: "Commons Library CI"

on:
  push:
    branches:
      - master
      - main
      - feature/phase4
  pull_request:
    branches:
      - master
      - main
      - feature/phase4
  workflow_dispatch:

concurrency:
  group: ci-commons-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build-and-verify:
    name: "Build, Test & Verify Modules (Java 25)"
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up OpenJDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven
          server-id: github
          settings-path: ${{ github.workspace }}

      - name: Compile and Run Module Tests
        run: mvn clean test -B

      - name: Build & Install Modules to Local Maven Cache
        run: mvn install -DskipTests -B

      - name: Publish Modules to GitHub Packages
        if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feature/phase4')
        run: mvn deploy -DskipTests -B -s ${{ github.workspace }}/settings.xml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
